<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocSite Search Helper</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    h1 {
      font-size: 18px;
      color: #1890ff;
      margin-top: 0;
    }
    
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    button {
      padding: 8px 12px;
      background-color: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #096dd9;
    }
    
    .shortcut {
      display: inline-block;
      background-color: #f5f5f5;
      border: 1px solid #d9d9d9;
      border-radius: 3px;
      padding: 2px 6px;
      font-family: monospace;
      margin: 0 2px;
      font-size: 12px;
    }
    
    .shortcut-list {
      margin-top: 15px;
      font-size: 13px;
    }
    
    .shortcut-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>DocSite Search Helper</h1>
  
  <div class="button-container">
    <button id="openSidebar">打开搜索侧边栏</button>
    <button id="openOptions">扩展配置</button>
    <button id="openHelp">查看帮助文档</button>
  </div>
  
  <div class="shortcut-list">
    <div class="shortcut-item">
      <span>格式化代码：</span>
      <span class="shortcut">Alt+Shift+F</span>
    </div>
    <div class="shortcut-item">
      <span>检查 SPAN 标签：</span>
      <span class="shortcut">Alt+Shift+S</span>
    </div>
    <div class="shortcut-item">
      <span>上传图片：</span>
      <span class="shortcut">Alt+Shift+U</span>
    </div>
    <div class="shortcut-item">
      <span>提取链接：</span>
      <span class="shortcut">Alt+L</span>
    </div>
  </div>
  
  <div class="footer">
    版本 1.0
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
