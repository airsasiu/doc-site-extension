<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation Helper</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-page">
  <main class="popup-shell">
    <header class="popup-header motion-rise">
      <div>
        <p class="eyebrow">Documentation Helper</p>
        <h1>快速入口</h1>
        <p class="lead">打开侧边栏、配置扩展，或者直接看帮助文档。</p>
      </div>
    </header>

    <section class="popup-actions motion-rise">
      <button id="openSidebar" type="button" class="primary-action">打开搜索侧边栏</button>
      <button id="openOptions" type="button" class="secondary-action">扩展配置</button>
      <button id="openHelp" type="button" class="secondary-action">查看帮助文档</button>
    </section>

    <section class="popup-shortcuts section motion-rise">
      <div class="section-head">
        <div>
          <p class="section-title">Shortcuts</p>
          <h2>常用快捷键</h2>
        </div>
      </div>
      <div class="shortcut-list">
        <div class="shortcut-item motion-rise">
          <span>格式化代码</span>
          <span class="shortcut">Alt+Shift+F</span>
        </div>
        <div class="shortcut-item motion-rise">
          <span>检查 SPAN 标签</span>
          <span class="shortcut">Alt+Shift+S</span>
        </div>
        <div class="shortcut-item motion-rise">
          <span>上传图片</span>
          <span class="shortcut">Alt+Shift+U</span>
        </div>
        <div class="shortcut-item motion-rise">
          <span>提取链接</span>
          <span class="shortcut">Alt+L</span>
        </div>
      </div>
    </section>

    <footer class="popup-footer motion-rise">
      版本 1.0
    </footer>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
