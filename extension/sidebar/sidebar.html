<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    <div class="search-header">
      <input type="text" class="search-input" placeholder="搜索文档内容...">
      <button class="search-button">搜索</button>
      <button class="routine-check-button">常规检查</button>
    </div>
    <div class="search-progress-container">
      <div class="progress-text"></div>
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </div>
    <div class="tab-container">
      <div class="tab-header"></div>
      <div class="tab-content"></div>
    </div>
    <div class="bottom-actions">
      <button class="recheck-button">重新检查错误页面 (0)</button>
      <div class="recheck-stats"></div>
      <button class="clear-results">清除所有结果</button>
    </div>
  </div>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
