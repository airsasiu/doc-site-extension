<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    
    <!-- 主要Tab导航 -->
    <div class="main-tab-header">
      <button class="main-tab-btn active" data-tab="search">搜索</button>
      <button class="main-tab-btn" data-tab="document-operations">文档操作</button>
      <button class="main-tab-btn" data-tab="page-operations">页面操作</button>
    </div>
    
    <!-- 搜索Tab内容 -->
    <div class="main-tab-content active" id="search-tab">
      <!-- 搜索进度条 -->
      <div class="search-progress-container">
        <div class="progress-text"></div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
      </div>
      <div class="search-section">
        <div class="search-input-container">
          <textarea class="search-input" placeholder="搜索文档内容..."></textarea>
          <div class="search-options">
            <label class="multiline-option">
              <input type="checkbox" class="multiline-checkbox">
              <span>多行匹配</span>
            </label>
            <div class="help-icon" title="勾选时，搜索内容将按换行分割为多个匹配项；不勾选时，所有内容作为一个匹配项">?</div>
          </div>
        </div>
        <div class="search-actions">
          <button class="search-button">搜索</button>
          <button class="routine-check-button">常规检查</button>
        </div>
      </div>
      
      <!-- 搜索结果区域 -->
      <div class="results-section">
        <div class="results-header">
          <div class="result-count"></div>
          <div class="view-toggle">
            <button class="view-toggle-btn active" data-view="list">列表视图</button>
            <button class="view-toggle-btn" data-view="tree">树形视图</button>
          </div>
        </div>
        <div class="tab-container">
          <div class="tab-header"></div>
          <div class="tab-content"></div>
        </div>
      </div>
    </div>
    
    <!-- 文档操作Tab内容 -->
    <div class="main-tab-content" id="document-operations-tab">
      <!-- 文档操作进度条 -->
      <div class="document-progress-container">
        <div class="progress-text"></div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
      </div>
    </div>
    
    <!-- 页面操作Tab内容 -->
    <div class="main-tab-content" id="page-operations-tab"></div>
  </div>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
