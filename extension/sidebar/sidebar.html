<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    <div class="search-header">
      <!-- 搜索分类 -->
      <div class="section-title">搜索相关</div>
      <input type="text" class="search-input" placeholder="搜索文档内容...">
      <div class="view-toggle">
        <button class="view-toggle-btn active" data-view="list">列表视图</button>
        <button class="view-toggle-btn" data-view="tree">树形视图</button>
      </div>
      <button class="search-button">搜索</button>
      
      <!-- 页面操作分类 -->
      <div class="section-title">页面操作</div>
      <button class="routine-check-button">常规检查</button>
      <button class="batch-add-button">批量添加页面</button>
    </div>
    <div class="search-progress-container">
      <div class="progress-text"></div>
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </div>
    <div class="tab-container">
      <div class="tab-header"></div>
      <div class="tab-content"></div>
    </div>
    
  </div>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
